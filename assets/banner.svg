<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#6366f1;#a855f7" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#ec4899;#06b6d4" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pulseGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pulseGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filter for soft blur on glow orbs -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Dynamic Ambient Backing Glow Orbs (Subtle Movement) -->
  <g filter="url(#blurFilter)">
    <circle cx="220" cy="80" r="140" fill="#6366f1" opacity="0.2">
      <animate attributeName="cx" values="220;260;180;220" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;120;60;80" dur="14s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.35;0.15;0.2" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="260" r="160" fill="#a855f7" opacity="0.2">
      <animate attributeName="cx" values="980;920;1020;980" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;220;290;260" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.35;0.15;0.2" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="300" r="130" fill="#06b6d4" opacity="0.15">
      <animate attributeName="cy" values="300;250;320;300" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.28;0.12;0.15" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Roadmap Flow Line in Background -->
  <g opacity="0.25">
    <path d="M 60 300 Q 300 240, 600 290 T 1140 250" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Pulse nodes on roadmap line -->
    <circle cx="280" cy="255" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="290" r="5" fill="#a855f7">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="265" r="4" fill="#ec4899">
      <animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Header & Badge -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 48)">
    <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title (Gradient Foreground) -->
  <text x="60" y="130" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-1">
    Product Management &amp; AI Templates
  </text>

  <!-- Subtitle -->
  <text x="60" y="168" fill="#e2e8f0" font-size="19" font-weight="500" letter-spacing="-0.2">
    Autonomous PRD Generators • Roadmapping • Discovery • Prioritization Frameworks
  </text>

  <!-- Short Description -->
  <text x="60" y="196" fill="#94a3b8" font-size="14" font-weight="400">
    The ultimate collection of enterprise SaaS platforms, open-source repos, and AI-native PM skill packs.
  </text>

  <!-- Interactive Dynamic Floating Feature Pills (Safely Positioned Below Title & Subtitle) -->
  <g transform="translate(60, 235)" filter="url(#pillShadow)">
    <!-- Pill 1: AI PRD Skills -->
    <g transform="translate(0, 0)">
      <rect width="195" height="42" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="26" fill="#38bdf8" font-size="16">🤖</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">AI PRD Skill Packs</text>
    </g>

    <!-- Pill 2: Strategic Roadmaps -->
    <g transform="translate(210, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="26" fill="#c084fc" font-size="16">🗺️</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Strategic Roadmaps</text>
    </g>

    <!-- Pill 3: Customer Discovery -->
    <g transform="translate(435, 0)">
      <rect width="215" height="42" rx="10" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="26" fill="#f472b6" font-size="16">💡</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Customer Discovery</text>
    </g>

    <!-- Pill 4: Product Analytics -->
    <g transform="translate(665, 0)">
      <rect width="205" height="42" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.7;0.3;0.7" dur="4.5s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="26" fill="#34d399" font-size="16">📊</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Product Analytics</text>
    </g>

    <!-- Pill 5: Scoring Frameworks -->
    <g transform="translate(885, 0)">
      <rect width="195" height="42" rx="10" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="3.8s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="26" fill="#fbbf24" font-size="16">⚖️</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">RICE &amp; Kano Scoring</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(60, 308)">
    <circle cx="6" cy="6" r="4" fill="#6366f1">
      <animate attributeName="fill" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" fill="#64748b" font-size="12" font-weight="500">Open-Source &amp; Enterprise SaaS Ecosystem • Verified Pricing, Valuations &amp; GitHub Metrics</text>
  </g>
</svg>
